services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: projectrelay
      POSTGRES_PASSWORD: projectrelay
      POSTGRES_DB: projectrelay
    ports:
      - "127.0.0.1:${PROJECT_RELAY_POSTGRES_PORT:-5434}:5432"
    volumes:
      - projectrelay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectrelay"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${PROJECT_RELAY_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  projectrelay-postgres:
